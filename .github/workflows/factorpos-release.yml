# ---------------------------------------------------------------
# FactorPOS — Windows release for the shop PCs
# ---------------------------------------------------------------
# Push a tag `vX.Y.Z` (all shops) or `vX.Y.Z-beta.N` (pilot PC with the beta
# channel switched on) whose version matches package.json. The workflow runs
# the full test suite, builds the unsigned NSIS installer, smoke-tests an
# install on Windows, and publishes a GitHub Release that the in-app updater
# reads (latest.yml for stable, beta.yml for beta).
#
# Tags start with "v" on purpose: upstream FloCafe's release.yml triggers on
# tags starting with a digit and builds for platforms FactorPOS doesn't ship.
#
# Installers are unsigned for now (owner decision, 2026-11-09). The updater
# still checks each download against the SHA-512 in latest.yml over HTTPS.

name: FactorPOS Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: factorpos-release-${{ github.ref }}
  # A tag doesn't move; never cancel a release half-way through uploading.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Check tag and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag against package.json
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match package.json version 'v$VERSION'."
            exit 1
          fi
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL=latest; PRERELEASE=false
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            CHANNEL=beta; PRERELEASE=true
          else
            echo "::error::Version '$VERSION' must be X.Y.Z (stable) or X.Y.Z-beta.N (pilot). The in-app updater ignores other prerelease names."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION on the '$CHANNEL' update channel"

  test:
    name: Full test suite (Linux)
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install system packages
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Lint
        run: npm run lint

      - name: Build
        run: |
          npm run build:frontend
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run full test suite
        run: xvfb-run -a --server-args='-screen 0 1280x800x24' npm test

  build-windows:
    name: Build and smoke-test Windows installer
    needs: [metadata, test]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build frontend
        run: npm run build:frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Compile backend
        run: npm run build

      - name: Build unsigned NSIS installer
        # bash: pwsh mangles the -c.publish.channel=... argument.
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never --config.npmRebuild=false -c.publish.channel="${{ needs.metadata.outputs.channel }}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify update files
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          $exe = "release\factorpos-$env:VERSION-win-x64.exe"
          foreach ($file in @($exe, "$exe.blockmap", "release\$env:CHANNEL.yml")) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
          }
          $manifest = Get-Content "release\$env:CHANNEL.yml" -Raw
          if ($manifest -notmatch "version: $([regex]::Escape($env:VERSION))") {
            throw "release\$env:CHANNEL.yml does not describe version $env:VERSION"
          }
          if ($manifest -notmatch "sha512:") { throw "release\$env:CHANNEL.yml has no sha512 checksum" }
          Write-Output $manifest

      - name: Install and launch the installer
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $installer = Get-Item "release\factorpos-$env:VERSION-win-x64.exe"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Silent install failed with exit code $($install.ExitCode)." }

          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter 'FactorPOS.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $app) { throw 'Installed FactorPOS.exe was not found.' }
          $updateConfig = Join-Path $app.DirectoryName 'resources\app-update.yml'
          if (-not (Test-Path $updateConfig)) { throw "Installed app has no updater config at $updateConfig" }
          Get-Content $updateConfig

          Start-Process -FilePath $app.FullName | Out-Null
          $healthy = $false
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            try {
              $response = Invoke-RestMethod -Uri 'http://127.0.0.1:3001/api/health' -TimeoutSec 2
              if ($response.status -eq 'ok') { $healthy = $true; break }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $healthy) { throw 'Installed FactorPOS did not become healthy within 120 seconds.' }

      - name: Stop installed app
        if: always()
        shell: pwsh
        run: Get-Process -Name 'FactorPOS' -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Write SHA-256 checksums
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $exe = Get-Item "release\factorpos-$env:VERSION-win-x64.exe"
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -FilePath 'release\SHA256SUMS.txt' -Encoding ascii

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factorpos-release-files
          path: |
            release/factorpos-${{ needs.metadata.outputs.version }}-win-x64.exe
            release/factorpos-${{ needs.metadata.outputs.version }}-win-x64.exe.blockmap
            release/${{ needs.metadata.outputs.channel }}.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [metadata, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factorpos-release-files
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite it. Bump the version and tag again."
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS=(--prerelease --latest=false)
          else
            FLAGS=(--latest)
          fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "FactorPOS $TAG" \
            --generate-notes \
            --verify-tag \
            "${FLAGS[@]}"
