name: Windows Test Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-test-installer:
    name: Build unsigned Windows test installer
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Mark package as a test build
        shell: bash
        run: npm version "$(node -p "require('./package.json').version")-dev.${GITHUB_RUN_NUMBER}" --no-git-tag-version

      - name: Install locked dependencies
        run: npm ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build frontend
        run: npm run build:frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Compile backend
        run: npm run build

      - name: Build unsigned NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never --config.npmRebuild=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release\factorpos-*-win-x64.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "release\SHA256SUMS.txt" -Encoding ascii -Append
          }

      - name: Upload test installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factorpos-windows-test-${{ github.sha }}
          path: |
            release/factorpos-*-win-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
